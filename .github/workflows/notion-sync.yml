name: Sync Notion SQL Notes

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/notion-sync.yml"
      - "scripts/sync-notion.mjs"
      - "scripts/sync-notion.test.mjs"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: write

concurrency:
  group: notion-sql-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Test exporter safety
        run: node --test scripts/sync-notion.test.mjs

      - name: Sync Notion pages
        run: npm run sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_SYNC_DATA_SOURCE_ID: f7de0b48-16d6-4321-9402-56a9391166d0

      - name: Commit synced notes
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo "Source branch changed; rerun sync."; exit 1; }
          git config user.name "notion-sync[bot]"
          git config user.email "notion-sync[bot]@users.noreply.github.com"

          git add -A -- sql .notion-sync-manifest.json
          if [ -d assets ] || git ls-files --error-unmatch assets >/dev/null 2>&1; then
            git add -A -- assets
          fi

          if git diff --cached --quiet; then
            echo "No Notion changes to commit."
            exit 0
          fi

          git commit -m "docs: sync Notion SQL notes"
          git push
